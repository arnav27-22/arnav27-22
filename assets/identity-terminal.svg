<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
<rect width="100%" height="100%" rx="14" fill="#060d08"/>
<rect x="1" y="1" width="758" height="298" rx="13" fill="none" stroke="#1a2b1a" stroke-width="2"/>
<g font-family="'JetBrains Mono',Consolas,monospace" font-size="24">
  <clipPath id="l1"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="220" begin="0.4s;12.2s" dur="0.5s" fill="freeze"/></rect></clipPath>
  <clipPath id="l2"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="420" begin="1.4s;13.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
  <clipPath id="l3"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="520" begin="2.6s;14.4s" dur="0.9s" fill="freeze"/></rect></clipPath>
  <clipPath id="l4"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="700" begin="4.0s;15.8s" dur="1.2s" fill="freeze"/></rect></clipPath>
  <clipPath id="l5"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="660" begin="5.7s;17.5s" dur="1.1s" fill="freeze"/></rect></clipPath>
  <clipPath id="l6"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="260" begin="7.3s;19.1s" dur="0.6s" fill="freeze"/></rect></clipPath>
  <clipPath id="l7"><rect x="40" y="0" width="0" height="300"><animate attributeName="width" from="0" to="620" begin="8.4s;20.2s" dur="1.0s" fill="freeze"/></rect></clipPath>

  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.92;0.98;1" dur="12.2s" repeatCount="indefinite"/>
    <text x="40" y="58" fill="#39ff14" clip-path="url(#l1)">$ whoami</text>
    <text x="40" y="98" fill="#caff3c" clip-path="url(#l2)">&gt; 18 | 27/7</text>
    <text x="40" y="138" fill="#caff3c" clip-path="url(#l3)">&gt; Founder of AROM Studio</text>
    <text x="40" y="178" fill="#caff3c" clip-path="url(#l4)">&gt; Web Developer • UI/UX • AI Enthusiast</text>
    <text x="40" y="218" fill="#caff3c" clip-path="url(#l5)">&gt; turning ideas into digital products</text>
    <text x="40" y="262" fill="#39ff14" clip-path="url(#l6)">$ cat .profile</text>
    <text x="40" y="292" fill="#8aff57" clip-path="url(#l7)">OPEN_TO = Full-Stack Roles + Web Products</text>

    <rect x="160" y="40" width="14" height="26" fill="#39ff14">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.04;0.08;0.12;0.16" dur="0.9s" begin="0.4s;12.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
</svg>