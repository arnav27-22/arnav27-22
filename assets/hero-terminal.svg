<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="ht ht2">
  <title id="ht">ARNAV PAGARE — Developer Terminal</title>
  <desc id="ht2">Animated developer terminal: whoami → arnav27-22, echo $NAME → ARNAV PAGARE, status → ONLINE · SYNCED, focus → AI · WEB · SOFTWARE · AUTOMATION. Typed character by character and looped.</desc>
  <style>
    @keyframes type { 0%,89% { opacity: 1 } 97%,100% { opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes gridmove { from { transform: translateX(0) } to { transform: translateX(-840px) } }
    @keyframes scanmove { from { transform: translateY(0) } to { transform: translateY(420px) } }
    @keyframes glowpulse { 0%,100% { opacity: .14 } 50% { opacity: .34 } }
    @keyframes glowslide { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-16px) } }
    @keyframes dotpulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(5px,-9px) } }
    .t { opacity: 0; animation: type 13s linear infinite }
    .pt { fill: #94a3b8 }
    .pc { fill: #22d3ee }
    .oc { fill: #dbe4ee }
    .ob { fill: #7dd3fc }
    .blink { animation: blink 1.1s steps(1) infinite }
    .grid { animation: gridmove 18s linear infinite }
    .scan { animation: scanmove 12s linear infinite }
    .pulse { animation: glowpulse 6s ease-in-out infinite }
    .slide { animation: glowslide 13s ease-in-out infinite }
    .d1 { animation: dotpulse 1.5s ease-in-out .15s infinite }
    .d2 { animation: dotpulse 1.5s ease-in-out .45s infinite }
    .d3 { animation: dotpulse 1.5s ease-in-out .75s infinite }
    .p1 { animation: drift 9s ease-in-out infinite }
    .p2 { animation: drift 12s ease-in-out .8s infinite }
    .p3 { animation: drift 16s ease-in-out 1.6s infinite }
    .p4 { animation: drift 20s ease-in-out 2.4s infinite }
    .fade { animation: fadein .35s ease-out forwards }
    @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#090f16"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".55"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="gridpat" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0L0 0 0 28" fill="none" stroke="#22314a" stroke-width="1" opacity=".6"/>
    </pattern>
    <pattern id="scan" x="0" y="0" width="320" height="4" patternUnits="userSpaceOnUse">
      <rect width="320" height="1.2" fill="#94a3b8" opacity=".05"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="termClip"><rect x="60" y="42" width="720" height="378" rx="14"/></clipPath>
  </defs>

