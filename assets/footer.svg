<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-labelledby="foot-title foot-desc">
  <title id="foot-title">ARNAV PAGARE — @arnav27-22</title>
  <desc id="foot-desc">Animated terminal-exit footer for the GitHub profile of ARNAV PAGARE (@arnav27-22). Session closed.</desc>
  <style>
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes wave1 { from { transform: translateX(0) } to { transform: translateX(-840px) } }
    @keyframes wave2 { from { transform: translateX(-420px) } to { transform: translateX(-1260px) } }
    @keyframes gentle { 0%,100% { opacity: .45 } 50% { opacity: .9 } }
    @keyframes drift { 0% { transform: translate(0,0) } 50% { transform: translate(8px,-12px) } 100% { transform: translate(0,0) } }
    @keyframes band { 0% { transform: translateX(-420px); opacity: 0 } 15% { opacity: .3 } 55% { opacity: .1 } 100% { transform: translateX(840px); opacity: 0 } }
    @keyframes glowpulse { 0%,100% { opacity: .18 } 50% { opacity: .4 } }
    .blink { animation: blink 1.2s steps(1) infinite }
    .w1 { animation: wave1 14s linear infinite }
    .w2 { animation: wave2 20s linear infinite }
    .gentle { animation: gentle 4s ease-in-out infinite }
    .drift1 { animation: drift 9s ease-in-out infinite }
    .drift2 { animation: drift 12s ease-in-out 1.2s infinite }
    .band { animation: band 16s ease-in-out infinite }
    .glow { animation: glowpulse 6s ease-in-out infinite }
  </style>
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="footStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#60a5fa" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7dd3fc" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect width="840" height="190" rx="16"/>
    </clipPath>
    <filter id="fsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="840" height="190" rx="16" fill="url(#footBg)" stroke="url(#footStroke)" stroke-width="1"/>
  <ellipse cx="420" cy="150" rx="300" ry="60" fill="#0e7490" opacity=".2" filter="url(#fsoft)" class="glow"/>

  <g>
