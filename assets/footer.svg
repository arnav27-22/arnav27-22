  </g>

  <g class="drift1"><circle cx="150" cy="134" r="1.8" fill="#22d3ee" opacity=".5"/></g>
  <g class="drift2"><circle cx="690" cy="126" r="1.5" fill="#a78bfa" opacity=".45"/></g>
  <g class="drift1"><circle cx="380" cy="150" r="1.4" fill="#22d3ee" opacity=".4"/></g>
