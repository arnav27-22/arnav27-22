      <path d="M0,160 C70,150 140,150 210,160 C280,170 350,170 420,160 C490,150 560,150 630,160 C700,170 770,170 840,160 L840,190 L0,190 Z" fill="#22d3ee" opacity=".045"/>
    </g>
    <g class="w2" opacity=".8">
