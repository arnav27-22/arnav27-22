  <text x="420" y="94" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#22d3ee">@arnav27-22<tspan class="blink" fill="#22d3ee">▌</tspan></text>
  <text x="420" y="122" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748b" class="gentle">session closed — thanks for exploring · github.com/arnav27-22</text>

