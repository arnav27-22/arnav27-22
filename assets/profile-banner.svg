<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-labelledby="bn1 bn2">
  <title id="bn1">ARNAV PAGARE — Profile Banner</title>
  <desc id="bn2">Animated profile banner for ARNAV PAGARE (@arnav27-22): web applications, developer tools, AI exploration. Real GitHub avatar with rotating ring and light sweep.</desc>
  <style>
    @keyframes borderpulse { 0%,100% { stroke-opacity: .45 } 50% { stroke-opacity: .95 } }
    @keyframes ringturn { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    @keyframes avglow { 0%,100% { opacity: .12 } 50% { opacity: .38 } }
    @keyframes sweep { 0% { transform: translateX(-420px); opacity: 0 } 12% { opacity: .5 } 45% { opacity: .14 } 100% { transform: translateX(840px); opacity: 0 } }
    @keyframes shim { 0%,100% { opacity: .45 } 50% { opacity: .9 } }
    @keyframes und { 0%,100% { transform: scaleX(.45) } 50% { transform: scaleX(1) } }
    @keyframes dotP { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    @keyframes float { 0%,100% { transform: translate(0,0) } 50% { transform: translate(5px,-8px) } }
    .bp { stroke-opacity: 0; animation: borderpulse 6s ease-in-out infinite }
    .ring { transform-origin: center; transform-box: fill-box; animation: ringturn 32s linear infinite }
    .ag { animation: avglow 5.5s ease-in-out infinite }
    .sweep { animation: sweep 10s ease-in-out infinite }
    .shim { animation: shim 4s ease-in-out infinite }
    .und { transform-origin: left; transform-box: fill-box; animation: und 9s ease-in-out infinite }
    .d1 { animation: dotP 3.4s ease-in-out .1s infinite }
    .d2 { animation: dotP 3.4s ease-in-out .6s infinite }
    .d3 { animation: dotP 3.4s ease-in-out 1.1s infinite }
    .fl1 { animation: float 11s ease-in-out infinite }
    .fl2 { animation: float 15s ease-in-out 1.4s infinite }
  </style>
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a28"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="bborder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset=".6" stop-color="#c7f5ff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bclip">
      <rect width="840" height="190" rx="16"/>
    </clipPath>
    <clipPath id="avatarClip">
      <circle cx="98" cy="96" r="40"/>
    </clipPath>
  </defs>

  <rect width="840" height="190" rx="16" fill="url(#bbg)"/>
  <rect width="840" height="190" rx="16" fill="none" stroke="url(#bborder)" stroke-width="1.2" class="bp"/>

  <rect width="840" height="260" x="-420" y="-100" fill="url(#sweepGrad)" class="sweep" clip-path="url(#bclip)"/>

  <g class="fl1"><circle cx="160" cy="150" r="1.8" fill="#22d3ee" opacity=".5"/></g>
  <g class="fl2"><circle cx="760" cy="60" r="1.6" fill="#a78bfa" opacity=".45"/></g>

  <circle cx="98" cy="96" r="46" fill="#22d3ee" class="ag"/>
  <g class="ring">
    <circle cx="98" cy="96" r="45" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="3 9" stroke-linecap="round" opacity=".8"/>
  </g>
  <g clip-path="url(#avatarClip)">
    <image href="./avatar.png" x="58" y="56" width="80" height="80" preserveAspectRatio="xMidYMid slice" alt=""/>
  </g>

  <text x="166" y="62" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#475569">profile · developer system</text>

  <text x="166" y="102" font-family="'JetBrains Mono',Consolas,monospace" font-size="30" font-weight="700" fill="url(#nameGrad)" letter-spacing="2">ARNAV PAGARE</text>
  <rect x="168" y="114" width="150" height="2.5" fill="#22d3ee" rx="1.25" class="und"/>
  <text x="166" y="138" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#7dd3fc">@arnav27-22</text>
  <text x="166" y="162" font-family="'JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#8b9bb4">web applications · developer tools · ai exploration</text>

  <text x="722" y="44" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#64748b">status</text>
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5">
    <text x="652" y="64" fill="#64748b"><tspan fill="#60a5fa" class="d1">●</tspan> web</text>
    <text x="706" y="64" fill="#64748b"><tspan fill="#22d3ee" class="d2">●</tspan> tools</text>
    <text x="758" y="64" fill="#64748b"><tspan fill="#a78bfa" class="d3">●</tspan> ai</text>
  </g>
  <text x="722" y="158" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#475569" class="shim">auto-synced · daily · github actions</text>
</svg>