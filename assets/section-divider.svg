<svg xmlns="http://www.w3.org/2000/svg" width="640" height="52" viewBox="0 0 640 52" role="img" aria-labelledby="sd1 sd2">
  <title id="sd1">Section divider</title>
  <desc id="sd2">Animated section divider with a traveling light point.</desc>
  <style>
    @keyframes travel { 0% { transform: translateX(-230px); opacity: 0 } 12% { opacity: .9 } 88% { opacity: .9 } 100% { transform: translateX(230px); opacity: 0 } }
    @keyframes travelB { 0%,100% { transform: translateX(230px) } 50% { transform: translateX(-230px) } }
    @keyframes spark { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .dotA { animation: travel 6s ease-in-out infinite }
    .dotB { animation: travelB 9s ease-in-out infinite }
    .spark { animation: spark 2.6s ease-in-out infinite }
  </style>
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="24" width="300" height="1.4" fill="url(#lineGrad)" rx="0.7"/>
  <rect x="340" y="24" width="300" height="1.4" fill="url(#lineGrad)" rx="0.7" transform="translate(0,0)"/>

  <g transform="translate(320,26)">
    <path d="M0,-3.4 L1.1,-0.9 L3.6,0 L1.1,0.9 L0,3.4 L-1.1,0.9 L-3.6,0 L-1.1,-0.9 Z" fill="#22d3ee" class="spark"/>
  </g>

  <g class="dotA" transform="translate(320,26)">
    <circle cx="0" cy="0" r="2.6" fill="#7dd3fc"/>
    <circle cx="0" cy="0" r="5.5" fill="#7dd3fc" opacity=".18"/>
  </g>
  <g class="dotB" transform="translate(320,26)">
    <circle cx="0" cy="0" r="1.7" fill="#60a5fa" opacity=".7"/>
  </g>
</svg>